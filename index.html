<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3ece2">
<title>ورادي التوحيد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a2a1c;--mut:#8a7561;--br:#906850;--dk:#704828;--gd:#c09868;--bad:#b3402f;--ok:#1d7f4a;--s1:#a9782f;--s2:#906850;--s3:#4b3425;--sh:#d3c2ac}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;color:var(--ink);font-size:16px;padding-bottom:110px;min-height:100vh;
background:radial-gradient(60% 40% at 12% 8%,#e6cfae 0,transparent 70%),radial-gradient(50% 45% at 95% 28%,#c0986870 0,transparent 70%),radial-gradient(70% 50% at 35% 105%,#90685050 0,transparent 70%),#f3ece2;background-attachment:fixed}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(243,236,226,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid #ffffffaa}
.lg{background:#fff;border-radius:16px;padding:4px 8px;box-shadow:0 4px 14px #70482826;flex:none}
.lg img{height:46px;display:block}
header h1{font-size:21px;font-weight:800;color:var(--dk)}
header p{font-size:13px;color:var(--mut);margin-top:1px}
main{max-width:980px;margin:0 auto;padding:14px}
button,input,select{font:inherit}
.gl,.st{background:rgba(255,255,255,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 28px #70482820,inset 0 1px 0 #fffc;border-radius:24px}
.st{padding:14px;margin-bottom:14px}
.st h2{font-size:18px;font-weight:800;color:var(--dk);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.st h3{font-size:13.5px;color:var(--mut);margin:10px 2px 6px;font-weight:500}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.nb{width:50px;height:50px;border-radius:50%;border:0;background:#f4ede3;color:var(--dk);font-size:26px;font-weight:700;cursor:pointer;box-shadow:6px 6px 14px var(--sh),-6px -6px 14px #fff;display:grid;place-items:center;flex:none}
.nb:active{box-shadow:inset 4px 4px 10px var(--sh),inset -4px -4px 10px #fff}
.ttl{flex:1;text-align:center}
.ttl b{display:block;font-size:19px;font-weight:800;color:var(--dk)}
.chip{display:inline-block;padding:3px 11px;border-radius:20px;background:#fff9;border:1px solid #fff;font-size:13px;font-weight:700;color:var(--dk)}
.chip.bd{color:var(--bad)}.chip.gd{color:var(--ok)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:8px;margin-bottom:12px}
.dp{border:0;background:transparent;border-radius:16px;padding:7px 0;color:var(--mut);cursor:pointer;display:grid;gap:1px;justify-items:center;position:relative}
.dp span{font-size:12px}.dp b{font-size:17px;color:var(--ink)}
.dp.on{background:var(--br);box-shadow:0 6px 14px #90685066}.dp.on span,.dp.on b{color:#fff}
.dp.td::after{content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--gd)}
.dp.on.td::after{background:#fff}
.pl{position:relative;display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:30px;background:#f4ede3;box-shadow:5px 5px 12px var(--sh),-5px -5px 12px #fff;font-weight:700;color:var(--dk);cursor:pointer;border:0}
.pl input{position:absolute;inset:0;opacity:0;width:100%}
.pl.wa{background:#25a15a;color:#fff;box-shadow:0 6px 14px #25a15a55}
.b{padding:9px 16px;border:0;border-radius:30px;background:#f4ede3;box-shadow:4px 4px 10px var(--sh),-4px -4px 10px #fff;font-weight:700;color:var(--dk);cursor:pointer}
.b.p{background:var(--br);color:#fff;box-shadow:0 6px 14px #90685066}
.b.d{color:var(--bad)}
input[type=text],input[type=date],select{padding:11px 12px;border:1px solid #e3d6c4;border-radius:14px;background:#fffc;width:100%;color:var(--ink)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row .cell{flex-direction:column;text-align:center;gap:6px;padding:12px 6px;align-items:center;min-width:0}
.row .cell>div{min-width:0;width:100%}
.row .cell b{word-break:break-word;font-size:15px}
.row .sb{flex-wrap:wrap;justify-content:center;font-size:11.5px;padding:3px 8px;line-height:1.4}
.row .nt{font-size:12px}
.cell{display:flex;gap:11px;align-items:center;text-align:right;padding:10px;border:1px solid #fff;border-radius:20px;background:rgba(255,255,255,.62);box-shadow:0 4px 14px #70482814;width:100%;cursor:pointer;color:var(--ink)}
.cell.s1{--c:var(--s1)}.cell.s2{--c:var(--s2)}.cell.s3{--c:var(--s3)}
.cell.abs{background:#f6dcd6cc}.cell.cov{background:#f8ecc9cc}.cell.dbl{background:#d9efe2cc}
.cell.short{background:#f6dcd6cc;border:1px dashed var(--bad)}
.cell b{display:block;font-size:16px;margin-bottom:2px}
.sb{display:inline-flex;gap:5px;align-items:center;color:#fff;background:var(--c);padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500}
.cell small{display:block;color:var(--mut);font-size:12.5px}
.nt{margin-top:4px;font-size:12.5px;font-weight:700}
.abs .nt,.short .nt{color:var(--bad)}.cov .nt{color:#8a5a00}.dbl .nt{color:var(--ok)}
.av{width:54px;height:54px;border-radius:50%;flex:none;background:#e5d6c3;color:var(--dk);display:grid;place-items:center;font-weight:800;font-size:21px;overflow:hidden;border:2px solid #fff;box-shadow:0 3px 10px #70482830}
.av img{width:100%;height:100%;object-fit:cover}
.abs .av img{filter:grayscale(1)}
.set{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.set .cell{flex-direction:column;text-align:center;gap:5px;padding:10px 4px}
.set .av{width:48px;height:48px}
.set .cell b{font-size:14px;word-break:break-word}
.hint{font-size:13.5px;color:var(--mut);line-height:1.7;margin:6px 0}
.ov{position:fixed;inset:0;background:#3a2a1c88;backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:rgba(250,245,238,.96);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:18px;max-height:90vh;overflow:auto;display:grid;gap:10px}
.sheet h3{font-size:18px;color:var(--dk)}
.sheet label{font-size:13px;color:var(--mut)}
.sheet .b{padding:13px 16px;text-align:center}
.pic{display:flex;gap:10px;align-items:center}
.pic .av{width:66px;height:66px}
.bn{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(92vw,420px);display:flex;gap:6px;padding:6px;z-index:6;background:rgba(255,255,255,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #fff;border-radius:30px;box-shadow:0 10px 30px #70482833}
.bn button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;border-radius:24px;padding:8px 4px;color:var(--mut);font-weight:700;font-size:13px;cursor:pointer}
.bn button.on{background:var(--br);color:#fff;box-shadow:0 6px 14px #90685066}
.ft{text-align:center;color:var(--mut);font-size:12.5px;margin-top:8px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:28px}}
@page{size:A5 landscape;margin:7mm}
@media print{
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{background:#fff;padding:0;font-size:10pt;min-height:0}
.bn,.noprint,.ft{display:none!important}
header{position:static;padding:0 0 4px;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;border:0}
.lg{box-shadow:none;padding:0}.lg img{height:26px}
header h1{font-size:13pt}header p{display:none}
main{padding:0;max-width:none}
.bar{margin:2px 0 4px}.ttl b{font-size:11pt}.chip{font-size:8pt;padding:1px 7px}
.st{padding:4px 6px;margin-bottom:4px;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;background:#fff;border:1px solid #cdbfae;border-radius:8px;break-inside:avoid}
.st h2{font-size:10.5pt;margin-bottom:3px}
.st h3{margin:3px 0 2px;font-size:8.5pt}
.row{grid-template-columns:repeat(3,1fr)!important;gap:4px}
.row .cell{flex-direction:row;text-align:right;padding:3px 5px;gap:5px;box-shadow:none;border-radius:8px;break-inside:avoid}
.row .cell>div{width:auto;text-align:right}
.av{width:28px;height:28px;font-size:12pt;border-width:1px;box-shadow:none}
.row .cell b{font-size:9.5pt;margin:0}
.row .sb{font-size:7.5pt;padding:0 5px;justify-content:flex-start}
.sb svg{width:9px;height:9px}
.row .nt{font-size:7.5pt;margin-top:1px}
}
</style>
</head>

<main id="app"></main>
<div id="md"></div>
<nav class="bn"><button id="t-day" onclick="go('day')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg> الجدول</button><button id="t-set" onclick="go('set')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6M16 4.5a3.5 3.5 0 010 7M18 14.5c2.2.7 3.5 2.7 3.5 5.5"/></svg> المكن والعمال</button></nav>
<script>
const SH=[null,{n:'الأولى',t:'7:30ص – 4:30م'},{n:'التانية',t:'3م – 11م'},{n:'التالتة',t:'10م – 8ص'}];
const SI=['<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>','<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 18h16M7 18a5 5 0 0110 0M12 6v3M5 10l1.5 1.5M19 10l-1.5 1.5"/></svg>','<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1110 4a6.5 6.5 0 0010 10.5z"/></svg>'];
const KEY='tawheed_shifts_v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const mod=(a,n)=>((a%n)+n)%n;
const dn=s=>Math.floor(Date.parse(s+'T00:00:00Z')/864e5);
const iso=n=>new Date(n*864e5).toISOString().slice(0,10);
const todayISO=()=>{const d=new Date();return iso(dn(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')))};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mk3=()=>[null,null,null];

function def(){return{anchor:todayISO(),w:{},abs:[],st:[
 {n:'مكنة رص 1',l:[mk3()]},{n:'مكنة رص 2',l:[mk3()]},
 {n:'المكوة الكبيرة',l:[mk3(),mk3()]},{n:'المكوة الصغيرة',l:[mk3(),mk3()]}]}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return def()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('مساحة التخزين ممتلئة. صغّر الصور أو اعمل نسخة احتياطية.')}}
let S=load(),tab='day',D=todayISO(),tmpP;

const week=d=>Math.floor((dn(d)-dn(S.anchor))/7);
const grp=(s,w)=>mod(s-1+w,3);          // رقم المجموعة اللي على الوردية s في الأسبوع w
const wk=id=>S.w[id]||{};

function absSet(d){
  const a=new Set(S.abs.filter(x=>x.d===d).map(x=>x.w));
  const y=iso(dn(d)-1);
  S.abs.filter(x=>x.m==='both'&&x.d===y&&x.c).forEach(x=>a.add(x.c));
  return a;
}
function restSet(d){const y=iso(dn(d)-1);return new Set(S.abs.filter(x=>x.m==='both'&&x.d===y&&x.c).map(x=>x.c))}

function lane(ln,d){
  const w=week(d),ab=absSet(d),rs=restSet(d);
  const ws=[1,2,3].map(s=>ln[grp(s,w)]);
  const miss=ws.map(x=>!x||ab.has(x));
  const r=ws.map((x,i)=>({wid:x,g:grp(i+1,w),st:miss[i]?'abs':'ok',nt:miss[i]?(!x?'خانة فاضية':rs.has(x)?'راحة (بدل تغطية امبارح)':'غائب'):''}));
  const both=S.abs.find(a=>a.d===d&&a.m==='both'&&ws[2]===a.w);
  if(both&&miss[2]&&!miss[1]&&ws[1]===both.c){r[1].st='dbl';r[1].nt='يشيل التانية والتالتة (3م ← 8ص)';return r}
  const n=miss.filter(Boolean).length;
  const ok=[0,1,2].filter(i=>!miss[i]);
  if(n===1){r[ok[0]].st='cov';r[ok[0]].nt='تطبيق 12س · 7:30ص ← 7:30م';r[ok[1]].st='cov';r[ok[1]].nt='تطبيق 12س · 7:30م ← 7:30ص'}
  else if(n>=2){ok.forEach(i=>{r[i].st='short';r[i].nt='عجز — محتاج بديل'})}
  return r;
}

const avh=w=>`<div class="av">${w.p?`<img src="${w.p}" alt="">`:esc((w.n||'؟').trim().charAt(0)||'؟')}</div>`;

function go(t){tab=t;render()}
function render(){
  $('#t-day').className=tab==='day'?'on':'';$('#t-set').className=tab==='set'?'on':'';
  $('#app').innerHTML=tab==='day'?dayV():setV();
}

function dayV(){
  const w=week(D),td=todayISO();
  const base=dn(D)-mod(new Date(dn(D)*864e5).getUTCDay()+1,7);
  const dt=new Date(D+'T12:00:00').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  let strip='';
  for(let i=0;i<7;i++){const d=iso(base+i),n=new Date(d+'T12:00:00');
    strip+=`<button class="dp ${d===D?'on':''} ${d===td?'td':''}" onclick="D='${d}';render()"><span>${n.toLocaleDateString('ar-EG',{weekday:'short'})}</span><b>${n.getDate()}</b></button>`}
  let na=0,ns=0,body='';
  S.st.forEach((st,si)=>{
    body+=`<section class="st"><h2>${esc(st.n)}</h2>`;
    st.l.forEach((ln,li)=>{
      if(st.l.length>1)body+=`<h3>عامل ${li+1} في الوردية</h3>`;
      const L=lane(ln,D);
      body+=`<div class="row">`+L.map((x,i)=>{const o=wk(x.wid);if(x.st==='abs')na++;if(x.st==='short')ns++;
        return `<button class="cell s${i+1} ${x.st}" onclick="act(${si},${li},${i})">${avh(o)}<div><b>${esc(o.n)||'— فاضي —'}</b><span class="sb">${SI[i]} ${SH[i+1].n} · ${SH[i+1].t}</span>${x.nt?`<div class="nt">${x.nt}</div>`:''}</div></button>`}).join('')+`</div>`;
    });
    body+=`</section>`;
  });
  return `<div class="gl strip noprint">${strip}</div>
  <div class="bar"><button class="nb noprint" onclick="mv(-1)" aria-label="اليوم اللي قبله">›</button>
  <div class="ttl"><b>${dt}</b><span class="chip">أسبوع ${w+1}</span> <span class="chip ${na?'bd':'gd'}">${na?'غياب: '+na:'مفيش غياب'}</span>${ns?` <span class="chip bd">عجز: ${ns}</span>`:''}</div>
  <button class="nb noprint" onclick="mv(1)" aria-label="اليوم اللي بعده">‹</button></div>
  <div class="bar noprint" style="justify-content:center"><label class="pl">اختيار تاريخ<input type="date" value="${D}" onchange="D=this.value||D;render()"></label><button class="pl" onclick="D=todayISO();render()">النهارده</button><button class="pl wa" onclick="wa()">إرسال واتساب</button><button class="pl" onclick="window.print()">طباعة</button></div>
  ${body}<p class="ft">اضغط على أي عامل لتسجيل الغياب أو تعديل بياناته</p>`;
}
function wa(){
  const w=week(D);
  const dt=new Date(D+'T12:00:00').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  let t=`*ورادي التوحيد إيجيبت*\n${dt}\nأسبوع ${w+1}\n`;
  S.st.forEach(st=>{
    t+=`\n*${st.n}*\n`;
    st.l.forEach((ln,li)=>{
      if(st.l.length>1)t+=`عامل ${li+1}:\n`;
      lane(ln,D).forEach((x,i)=>{
        const nm=wk(x.wid).n||'فاضي';
        const nt=x.st==='abs'?' (غائب)':x.st==='cov'?' (تطبيق 12س)':x.st==='dbl'?' (يشيل التانية والتالتة)':x.st==='short'?' (عجز - محتاج بديل)':'';
        t+=`${SH[i+1].n} ${SH[i+1].t}: ${nm}${nt}\n`;
      });
    });
  });
  window.open('https://wa.me/?text='+encodeURIComponent(t.trim()),'_blank');
}
function mv(n){D=iso(dn(D)+n);render()}

function setV(){
  let h=`<div class="st"><h2>بداية الدوران</h2>
  <label class="hint">أول يوم في الأسبوع الأول (الترتيب المسجّل تحت هو ترتيب الأسبوع ده)</label>
  <input type="date" value="${S.anchor}" onchange="S.anchor=this.value||S.anchor;save()">
  <p class="hint">كل أسبوع: الأولى ← التالتة، التانية ← الأولى، التالتة ← التانية. الجدول بيتحسب لوحده لأي تاريخ.</p></div>`;
  S.st.forEach((st,si)=>{
    h+=`<section class="st"><h2><span>${esc(st.n)}</span><span class="noprint"><button class="b" onclick="rn(${si})">اسم</button> <button class="b d" onclick="dl(${si})">حذف</button></span></h2>`;
    st.l.forEach((ln,li)=>{
      if(st.l.length>1)h+=`<h3>عامل ${li+1} في الوردية</h3>`;
      h+=`<div class="set">`+ln.map((id,g)=>{const o=wk(id);return `<button class="cell s${g+1}" onclick="edit(${si},${li},${g})">${avh(o)}<b>${esc(o.n)||'— فاضي —'}</b><small>وردية ${SH[g+1].n}</small></button>`}).join('')+`</div>`;
    });
    h+=`<div class="bar" style="margin:10px 0 0"><button class="b" onclick="ln(${si},1)">+ عامل في الوردية</button>${st.l.length>1?`<button class="b" onclick="ln(${si},-1)">− عامل</button>`:''}</div></section>`;
  });
  h+=`<div class="bar"><button class="b p" onclick="ad()">+ إضافة مكنة / قسم</button><button class="b" onclick="ex()">نسخة احتياطية</button><label class="b">استرجاع<input type="file" accept=".json" hidden onchange="im(this.files[0])"></label></div>
  <p class="hint">البيانات محفوظة على الجهاز ده. اعمل نسخة احتياطية من وقت للتاني. الخانة الفاضية بتتحسب غياب وبتتغطى بنفس القاعدة.</p>`;
  return h;
}

function rn(si){const n=prompt('اسم المكنة',S.st[si].n);if(n){S.st[si].n=n;save();render()}}
function dl(si){if(confirm('حذف '+S.st[si].n+' بكل عمالها؟')){S.st.splice(si,1);save();render()}}
function ad(){const n=prompt('اسم المكنة أو القسم');if(!n)return;const c=Math.max(1,+prompt('عدد العمال في الوردية الواحدة','1')||1);S.st.push({n,l:Array.from({length:c},mk3)});save();render()}
function ln(si,d){const st=S.st[si];if(d>0)st.l.push(mk3());else{if(st.l[st.l.length-1].some(x=>x)&&!confirm('آخر صف فيه عمال، هيتمسحوا. متأكد؟'))return;st.l.pop()}save();render()}

function sheet(h){$('#md').innerHTML=`<div class="ov" onclick="if(event.target===this)cl()"><div class="sheet">${h}</div></div>`}
function cl(){$('#md').innerHTML=''}
const bt=(t,f,c='')=>`<button class="b ${c}" onclick="${f}">${t}</button>`;

function act(si,li,i){
  const w=week(D),ln=S.st[si].l[li],g=grp(i+1,w),id=ln[g],o=wk(id);
  const ab=S.abs.find(a=>a.d===D&&a.w===id);
  let h=`<h3>${esc(o.n)||'خانة فاضية'} — الوردية ${SH[i+1].n}</h3>`;
  if(id){
    if(ab)h+=bt('إلغاء الغياب',`ua('${ab.id}')`,'p');
    else{
      h+=bt('غائب — الاتنين التانيين يطبقوا 12 ساعة',`mka(${si},${li},${g},'x')`,'p');
      if(i===2&&ln[grp(2,w)])h+=bt('غائب — بتاع التانية يشيل التانية والتالتة ويغيب بكرة',`mka(${si},${li},${g},'both')`);
    }
  }
  h+=bt('تعديل الاسم / الصورة / تبديل',`edit(${si},${li},${g})`)+bt('إغلاق','cl()');
  sheet(h);
}
function mka(si,li,g,m){
  const w=week(D),ln=S.st[si].l[li],id=ln[g];
  S.abs.push({id:uid(),d:D,w:id,m,c:m==='both'?ln[grp(2,w)]:null});save();cl();render();
}
function ua(id){S.abs=S.abs.filter(a=>a.id!==id);save();cl();render()}

function edit(si,li,g){
  tmpP=undefined;
  const id=S.st[si].l[li][g],o=wk(id);
  let opts='<option value="">— اختار —</option>';
  S.st.forEach((s,a)=>s.l.forEach((l,b)=>l.forEach((x,c)=>{if(!(a===si&&b===li&&c===g))opts+=`<option value="${a},${b},${c}">${esc(s.n)}${s.l.length>1?' · عامل '+(b+1):''} · وردية ${SH[c+1].n} — ${esc(wk(x).n)||'فاضي'}</option>`})));
  sheet(`<h3>${esc(S.st[si].n)} · وردية ${SH[g+1].n} (ترتيب أسبوع البداية)</h3>
  <label>الاسم</label><input type="text" id="nm" value="${esc(o.n)}" placeholder="اسم العامل">
  <label>الصورة</label><div class="pic"><div id="pv">${avh(o)}</div><input type="file" accept="image/*" onchange="pk(this.files[0])"></div>
  ${bt('حفظ',`sv(${si},${li},${g})`,'p')}
  <label>تبديل مع عامل تاني</label><select onchange="sw(${si},${li},${g},this.value)">${opts}</select>
  ${id?bt('مسح العامل من الخانة',`rm(${si},${li},${g})`,'d'):''}${bt('إغلاق','cl()')}`);
}
function pk(f){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const m=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,160,160);tmpP=c.toDataURL('image/jpeg',.72);$('#pv').innerHTML=avh({p:tmpP,n:$('#nm').value})};i.src=r.result};r.readAsDataURL(f)}
function sv(si,li,g){
  let id=S.st[si].l[li][g];const n=$('#nm').value.trim();
  if(!id){if(!n&&tmpP===undefined){cl();return}id=uid();S.w[id]={};S.st[si].l[li][g]=id}
  S.w[id].n=n;if(tmpP!==undefined)S.w[id].p=tmpP;
  save();cl();render();
}
function sw(si,li,g,v){
  if(!v)return;const [a,b,c]=v.split(',').map(Number);
  const x=S.st[si].l[li],y=S.st[a].l[b];const t=x[g];x[g]=y[c];y[c]=t;save();cl();render();
}
function rm(si,li,g){
  const id=S.st[si].l[li][g];if(!confirm('مسح '+(wk(id).n||'العامل')+' من الخانة؟'))return;
  S.st[si].l[li][g]=null;
  if(!S.st.some(s=>s.l.some(l=>l.includes(id)))){delete S.w[id];S.abs=S.abs.filter(a=>a.w!==id&&a.c!==id)}
  save();cl();render();
}
function ex(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='tawheed-shifts-'+todayISO()+'.json';a.click()}
function im(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.st||!j.anchor)throw 0;S=j;save();render()}catch(e){alert('الملف ده مش نسخة صحيحة')}};r.readAsText(f)}
render();
</script>
</body>
</html>
